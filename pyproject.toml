[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ucmf"
version = "0.1.0"
description = "Sparse solvers for unfolded covariance matrix fitting"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
]

[dependency-groups]
examples = ["acoular", "matplotlib", "pylops", "threadpoolctl"]
dev = [
    "pytest>=8,<9.1",  # pytest-cases 3.10.1 is incompatible with pytest 9.1.
    "pytest-cases>=3.10.1",
    "ruff>=0.9",
    { include-group = "examples" },
]

[tool.uv.sources]
acoular = { git = "https://github.com/acoular/acoular.git", branch = "cmf-problem-assembly" }

[tool.hatch.build.targets.wheel]
packages = ["src/ucmf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

# Acoular must be imported before NumPy (numba/OpenBLAS threading), as in Acoular itself.
[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "acoular", "first-party", "local-folder", "third-party"]

[tool.ruff.lint.isort.sections]
acoular = ["acoular"]

[tool.ruff.format]
quote-style = "single"
